# SonarCloud: análisis estático centralizado (bugs, vulnerabilidades, code
# smells, duplicación) con un quality gate que se informa en cada PR.
# Lo lee el job `sonarcloud` de .github/workflows/ci.yml, que sólo corre en el
# modo de análisis desde el CI. El modo activo hoy, el análisis automático, lee
# .sonarcloud.properties: si se cambia qué se analiza, cambiar los dos.
sonar.organization=fabrithompson
sonar.projectKey=fabrithompson_CentroEducativo
sonar.projectName=Centro Educativo - Educar para Transformar

sonar.sourceEncoding=UTF-8

# Código de la aplicación. Las pruebas viven junto al código (*.test.ts), así
# que se excluyen de las fuentes y se declaran aparte como pruebas.
sonar.sources=web/backend/src,web/backend/prisma,web/frontend,mobile/src
sonar.exclusions=**/*.test.ts,**/*.e2e.ts,**/node_modules/**,**/dist/**,web/backend/uploads/**,web/backend/prisma/migrations/**

sonar.tests=web/backend/src,web/backend/e2e,mobile/src
sonar.test.inclusions=**/*.test.ts,**/*.e2e.ts
