name: Tarea técnica
description: Trabajo de infraestructura, calidad o documentación.
labels: ["tipo: tarea"]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué hay que hacer
    validations:
      required: true
  - type: textarea
    id: por-que
    attributes:
      label: Por qué
      description: Qué métrica, defecto o requerimiento lo motiva.
  - type: textarea
    id: hecho
    attributes:
      label: Cuándo está terminada
      placeholder: |
        - [ ] …
    validations:
      required: true
