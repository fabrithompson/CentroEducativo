name: CI

# Hasta ahora las pruebas corrían sólo si alguien se acordaba de correrlas.
# Esto las vuelve obligatorias en cada PR contra las dos ramas de integración.
on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main, developer]

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene
# sentido esperar el resultado de un commit que ya quedó atrás.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck y pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL de verdad, no un doble. Las reglas de negocio de este proyecto
    # viven en disparadores PL/pgSQL, restricciones CHECK y un índice único
    # parcial: sin motor real no se verifica ninguna de las tres.
    #
    # Es un service container y no `embedded-postgres` porque las variantes de
    # Linux de ese paquete están deshabilitadas en pnpm-workspace.yaml, para no
    # meter ~100 MB de binarias en la imagen que se despliega a Railway.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: educar
          POSTGRES_PASSWORD: educar
          POSTGRES_DB: educar_transformar_test
          # La base de producción es UTF8. Si acá fuera otra, un carácter fuera
          # de Latin-1 en una migración pasaría el CI y rompería el despliegue,
          # que es exactamente lo que ya pasó una vez con el símbolo ∈.
          POSTGRES_INITDB_ARGS: '--encoding=UTF8 --lc-collate=C --lc-ctype=C'
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U educar -d educar_transformar_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar el cliente de Prisma
        # `typecheck` compila contra los tipos que genera Prisma. En un runner
        # limpio todavía no existen, y tsc falla por tipos que no encuentra.
        run: pnpm --filter backend exec prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Pruebas de integración contra PostgreSQL
        # Aplica las 9 migraciones, carga el seed, verifica las reglas en el
        # motor y corre la suite completa del backend.
        run: pnpm --filter backend test:integracion
        env:
          DATABASE_URL_TEST: postgresql://educar:educar@localhost:5432/educar_transformar_test?schema=public

      - name: Pruebas de la aplicación móvil
        # El dominio de la app —cálculo de importes, clasificación de cuotas,
        # TOTP— no toca la base y corre aparte de la suite de integración.
        run: pnpm --filter mobile test
